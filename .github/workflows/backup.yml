name: Backup noturno
on:
  schedule:
    - cron: '17 6 * * *'   # 02:17 em Manaus (06:17 UTC), todo dia
  workflow_dispatch: {}     # permite rodar na hora pelo botao "Run workflow"
permissions:
  contents: write
concurrency: backup
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Copiar dados e fotos do Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 backup.py
      - name: Gravar no historico
        run: |
          git config user.name "Backup Frota"
          git config user.email "backup@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "sem mudancas"; exit 0; fi
          git commit -m "Backup $(TZ=America/Manaus date '+%d/%m/%Y %H:%M')"
          git push

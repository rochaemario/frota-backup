name: Baixar bibliotecas do app
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e conferir supabase-js 2.45.4 (pacote oficial do npm x CDN)
        run: |
          set -e
          mkdir -p libs/tmp && cd libs/tmp
          npm pack @supabase/supabase-js@2.45.4 >/dev/null
          tar xzf supabase-supabase-js-2.45.4.tgz
          curl -sSfL -o cdn.js https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js
          cmp cdn.js package/dist/umd/supabase.min.js && echo "CDN igual ao pacote oficial"
          cp package/dist/umd/supabase.min.js ../supabase-2.45.4.min.js
          cd .. && rm -rf tmp
          echo "sha384-$(openssl dgst -sha384 -binary supabase-2.45.4.min.js | openssl base64 -A)" > supabase-2.45.4.sri
          cat supabase-2.45.4.sri
      - name: Guardar
        run: |
          git config user.name "Backup Frota"; git config user.email "backup@users.noreply.github.com"
          git add libs; git commit -m "Biblioteca supabase-js conferida" || true; git pull --rebase -q; git push
